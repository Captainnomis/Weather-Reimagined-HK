<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Reimagined HK</title>
    <link rel="stylesheet" href="styles.css">
    <script src="test.js"></script>
</head>
<body>
    <h1 class="welcome">Welcome to Weather Reimagined HK!</h1>
    <p class="general-info">Your go-to app for accurate and up-to-date weather information in Hong Kong.</p>
    <div class="weather-section">
        <div class="weather-cards">
            <div class="currentWeather">
                <h2>Current Weather</h2>
                <p class="weather-data">Loading current weather data...</p>
            </div>
            <div class="forecast">
                <h2 class="forecast-period">3-Day Forecast</h2>
                <p class="forecast-data">Loading forecast data...</p>
            </div>
        </div>   
</body>
</html>
